<section>
<h2>اليوم 1: من الطلب الغامض إلى قرار موثق</h2>
<ol>
<li><p>مدير إدارة صيانة افتراضية كتب: «نريد نظامًا ذكيًا يتنبأ بأعطال المكيفات». في المكالمة عرفت أن لجنة المشتريات ستقرر بعد شهرين تجديد عقد الصيانة أو طرحه. ما السطر الأول؟</p><ul><li><b>أ.</b> تصميم نظام ذكي يتنبأ بأعطال المكيفات قبل وقوعها، ويخفض تكلفة الصيانة السنوية</li><li><b>ب.</b> تقرر لجنة المشتريات بعد شهرين تجديد عقد الصيانة أو طرحه، وبأي شروط</li><li><b>ج.</b> تحليل بيانات الأعطال في السنوات الثلاث الماضية وتقديم توصيات</li><li><b>د.</b> يقرر مدير الصيانة أي نظام ذكي يشتري للتنبؤ بالأعطال</li></ul></li>
<li><p>مذكرة نطاق لإدارة الحدائق الافتراضية فيها القرار والمخرجات ومعيار قبول «توصية مقنعة». وفي المكالمة قال المدير في آخرها: «وستساعدوننا في اختيار المورد». ما أهم تعديل قبل إرسالها؟</p><ul><li><b>أ.</b> اختصارها إلى نصف صفحة حتى يقرأها المدير كاملة</li><li><b>ب.</b> إضافة اختيار المورد إلى المخرجات بالسعر نفسه، فهو ما يتوقعه المدير من الفريق</li><li><b>ج.</b> إضافة جملة شكر تذكر حرص الإدارة على التطوير</li><li><b>د.</b> كتابة اختيار المورد في الاستثناءات، ومعيار قبول يمكن التحقق منه</li></ul></li>
<li><p>إدارة الحدائق الافتراضية تريد من خمسة مسؤولين أن يتفقوا على أولويات الصيف. أي خطة تختار؟</p><ul><li><b>أ.</b> يكتب كل مسؤول أولويتين، ثم تجميع، ثم قرار بقاعدة أُعلنت في البداية</li><li><b>ب.</b> يعرض الميسّر قائمته المقترحة ويطلب التعليق عليها</li><li><b>ج.</b> نقاش مفتوح ثم تصويت إن لم يتفقوا في آخر خمس دقائق</li><li><b>د.</b> نقاش حر يسمح لكل مسؤول بالكلام بقدر ما يحتاج</li></ul></li>
<li><p>في ورشة لإدارة الحدائق الافتراضية، مضت 12 دقيقة. المدير والمهندس تكلما كثيرًا، ومسؤولة السلامة لم تقل شيئًا، والأوزان شبه متفق عليها. ما الخطوة التالية؟</p><ul><li><b>أ.</b> إعلان الأوزان وقراءة المحضر، فالجميع يبدو موافقًا</li><li><b>ب.</b> الطلب من المدير أن يتوقف ليتكلم غيره</li><li><b>ج.</b> دعوة مسؤولة السلامة بالاسم: ما الذي يجب أن يكون شرطًا من جهتك؟</li><li><b>د.</b> تدوين أن مسؤولة السلامة ستُستشار بعد الورشة في ما يخص شروط السلامة</li></ul></li>
<li><p>مديرة إدارة نقل مدرسي افتراضية تطلب «لوحة ذكية لتتبع الحافلات». في المكالمة قالت إن مجلس الإدارة سيقرر بعد ستة أسابيع هل يجدد عقد المشغل. ما سؤال القرار في مذكرة النطاق؟</p><ul><li><b>أ.</b> تصميم لوحة ذكية تعرض مواقع الحافلات لحظة بلحظة لأولياء الأمور</li><li><b>ب.</b> تختار المديرة خلال ستة أسابيع مزود اللوحة الذكية الأنسب لأولياء الأمور</li><li><b>ج.</b> يقرر المجلس بعد ستة أسابيع تجديد عقد المشغل أو طرحه، وبأي شروط</li><li><b>د.</b> تحليل بيانات الحافلات في السنة الماضية واقتراح تحسينات</li></ul></li>
<li><p>في مكالمة استكشافية مع مكتبة عامة افتراضية قال المدير: «نريد مساعدًا ذكيًا للرواد هذا العام». أي سؤال متابعة يكشف أكثر عن القرار؟</p><ul><li><b>أ.</b> لماذا هذا العام تحديدًا، ومن طرح الفكرة؟</li><li><b>ب.</b> هل تفضّلون مساعدًا بالعربية أم بلغتين؟</li><li><b>ج.</b> أي منصة تستخدمون اليوم لموقع المكتبة وتطبيقها على الجوال؟</li><li><b>د.</b> كم سؤالًا يصلكم من الرواد في الشهر؟</li></ul></li>
<li><p>أي معيار قبول يستطيع طرف ثالث أن يتحقق منه في ورقة توصية لهيئة نقل افتراضية؟</p><ul><li><b>أ.</b> ورقة عالية الجودة تعكس خبرة الفريق وعمق تحليله</li><li><b>ب.</b> توصية واضحة يقتنع بها الراعي</li><li><b>ج.</b> ورقة تراعي أفضل الممارسات العالمية</li><li><b>د.</b> لكل رقم في الورقة مرجع في حزمة الأدلة</li></ul></li>
<li><p>في الأسبوع الثالث من تكليف لجامعة افتراضية طلب الراعي «تحليلًا صغيرًا إضافيًا» لكلية لم تكن في النطاق. ماذا يحدث أولًا بحسب بند تغيير النطاق؟</p><ul><li><b>أ.</b> يبدأ الفريق التحليل فورًا، ثم يناقش أثره مع الراعي لاحقًا</li><li><b>ب.</b> يُكتب الطلب وأثره على الموعد والجهد، ويبدأ بعد موافقة مكتوبة</li><li><b>ج.</b> يرفض الفريق الطلب، فالمذكرة الموقعة لا تتغير بعد التوقيع</li><li><b>د.</b> يطلب الفريق من الكلية بياناتها مباشرة ليوفر على الراعي وقت المتابعة والموافقة</li></ul></li>
<li><p>في ورشة قرار، إذا لم يعترض أحد على الأوزان المقترحة خلال دقيقتين، فهذا يكفي دليلًا على قبول الجميع.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>ورشة لإدارة رعاية صحية افتراضية: المدير العام وحده يملك القرار، والحاضرون ستة رؤساء أقسام مختلفون. أي قاعدة قرار تعلنها في البداية؟</p><ul><li><b>أ.</b> الإجماع، حتى يلتزم الجميع بالنتيجة</li><li><b>ب.</b> التصويت، فالأغلبية تحسم بسرعة</li><li><b>ج.</b> المدير العام يقرر بعد سماع الجميع، ويُكتب الاعتراض</li><li><b>د.</b> لا قاعدة مسبقة، فالنقاش نفسه يكشف الطريقة المناسبة لكل خلاف</li></ul></li>
<li><p>في الدقيقة الثالثة من ورشة لبلدية افتراضية، يتكلم نائب الرئيس منذ البداية ويقاطع الآخرين. ما أنسب خطوة؟</p><ul><li><b>أ.</b> جولة مكتوبة: معياران لكل مسؤول، ثم قراءتها بالترتيب</li><li><b>ب.</b> الطلب من نائب الرئيس أمام الجميع أن يترك المجال لغيره</li><li><b>ج.</b> تركه يكمل حديثه، فهو صاحب القرار ورأيه سيحسم النقاش في النهاية</li><li><b>د.</b> إيقاف الورشة وتأجيلها إلى موعد لا يحضره نائب الرئيس</li></ul></li>
<li><p>أي محضر لورشة قرار في جهة افتراضية للإسكان يصمد أكثر بعد أسبوع؟</p><ul><li><b>أ.</b> ملخص لما قاله كل مسؤول، بترتيب الكلام</li><li><b>ب.</b> قرار بصياغة عامة يقبلها الجميع دون تحفظ</li><li><b>ج.</b> توصية الميسّر بما يراه أفضل بعد النقاش</li><li><b>د.</b> القرار بأرقامه، وقاعدته، ومن اعترض، وما بقي لقرار لاحق ومن يملكه</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: من الأدلة إلى توصية تصمد</h2>
<ol>
<li><p>بعد أسبوعين من توقيع مذكرة نطاق لإدارة نقل افتراضية، يطلب الراعي «تحليلًا سريعًا» لخط حافلات جديد لم يُذكر في المذكرة. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> تطبيق بند تغيير النطاق: أثر الطلب على الموعد والجهد، وموافقة مكتوبة قبل البدء</li><li><b>ب.</b> البدء فورًا، فالتحليل صغير والعميل يقدّر المرونة</li><li><b>ج.</b> الاعتذار عنه، فالمذكرة الموقعة لا تتغير بعد التوقيع</li><li><b>د.</b> تسجيله في محضر الاجتماع القادم، ومناقشته مع الراعي في الإحاطة الأخيرة للتكليف</li></ul></li>
<li><p>ورقة لشبكة المكتبات الافتراضية توصي بالحجز الإلكتروني. المورد يقدّر التنفيذ بشهر، ولم ينفذ مثله للشبكة من قبل، والعام الدراسي يبدأ بعد شهرين.</p><ul><li><b>أ.</b> تخضع مدة التنفيذ لعوامل كثيرة خارج سيطرة الفريق، وقد تختلف عن تقدير المورد</li><li><b>ب.</b> ينفذ المورد الحجز الإلكتروني في شهر واحد قبل بدء العام الدراسي</li><li><b>ج.</b> المدة تقدير المورد دون تجربة سابقة؛ وإن زادت على شهرين، فاتت بداية العام</li><li><b>د.</b> نوصي بتمديد الساعات بدل الحجز، فهو أقل اعتمادًا على المورد</li></ul></li>
<li><p>مسودة صاغها نموذج لشبكة المكتبات الافتراضية فيها: «بحسب دراسة المعهد الوطني لخدمات القراءة (2024)، يرتفع الاستخدام 40% بعد تركيب الخزائن». لم تجد المعهد ولا الدراسة.</p><ul><li><b>أ.</b> لا شيء، فاسم الجهة والسنة يكفيان للدلالة على وجوده</li><li><b>ب.</b> تطلب من النموذج رابط الدراسة، وتبقيها إن أعطاك رابطًا</li><li><b>ج.</b> تخفف الصياغة إلى «تشير دراسات إلى ارتفاع كبير»</li><li><b>د.</b> مرجع لا يمكن التحقق منه، عالٍ؛ يُحذف الادعاء ورقمه</li></ul></li>
<li><p>لتلخيص محاضر لجنة في جهة حكومية افتراضية، جمع زميل المحاضر الثمانية في ملف واحد. سبعة منها «عام»، والثامن «مقيد» لأنه يذكر ميزانية لم تُعتمد.</p><ul><li><b>أ.</b> المحاضر السبعة العامة وحدها، في ملف لا يضم المحضر المقيد</li><li><b>ب.</b> الملف كله، فأغلب ما فيه «عام»، والمقيد محضر واحد من ثمانية محاضر</li><li><b>ج.</b> الملف كله بعد حذف أرقام الميزانية من المحضر الثامن</li><li><b>د.</b> لا شيء منها، فالمحاضر الحكومية لا تدخل أداة توليدية</li></ul></li>
<li><p>في منتصف تكليف تقارن فيه شركتك ثلاث منصات لجهة افتراضية، يعرض أحد الموردين الثلاثة على شركتك أن تصبح شريكه المعتمد في التنفيذ.</p><ul><li><b>أ.</b> تقبل الشركة، ويُبعد عن المقارنة المستشار الذي تفاوض مع المورد</li><li><b>ب.</b> تفصح للعميل كتابيًا، ولا تقبل الشراكة ما دامت تقيّم المورد</li><li><b>ج.</b> تقبل الشراكة بعد تسليم التوصية، وتذكرها في الإحاطة الأخيرة</li><li><b>د.</b> تقبل وتفصح للعميل، فالإفصاح يكفي ما دام مكتوبًا</li></ul></li>
<li><p>ورقة خيارات لإدارة مياه افتراضية تقارن ثلاثة خيارات جديدة. ماذا ينقصها إن لم تذكر ماذا يحدث لو بقي كل شيء كما هو؟</p><ul><li><b>أ.</b> لا ينقصها شيء، فالراعي يعرف الوضع الحالي</li><li><b>ب.</b> مرجع تُقاس عليه منفعة كل خيار وتكلفته</li><li><b>ج.</b> خيار رابع يجب أن يُوصى به دائمًا</li><li><b>د.</b> قسم تاريخي عن نشأة الإدارة</li></ul></li>
<li><p>في ورقة لمكتبة افتراضية جملة: «سيقبل الرواد الخدمة الجديدة بسرعة». الحزمة فيها استبانة تقول إن 41% يفضلون الخدمة الذاتية. كيف تكتب الجملة؟</p><ul><li><b>أ.</b> تبقى كما هي، فهي تقدير معقول من خبير</li><li><b>ب.</b> تُحذف، فلا مكان للتقدير في ورقة خيارات</li><li><b>ج.</b> يفضّل 41% الخدمة الذاتية (الاستبانة)؛ ونقدّر أن القبول أبطأ عند البقية</li><li><b>د.</b> سيقبل 41% من الرواد الخدمة الجديدة في الشهر الأول من تشغيلها، والبقية بعده</li></ul></li>
<li><p>الخيار الموصى به في ورقة الخيارات قد لا يحصل على أعلى درجة في كل معيار.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>ورقة لهيئة طرق افتراضية توصي بخيار منفعته بين 200 ألف و500 ألف ريال سنويًا. أي صياغة لعدم اليقين أنفع للراعي؟</p><ul><li><b>أ.</b> المنفعة المتوقعة 350 ألف ريال سنويًا</li><li><b>ب.</b> المنفعة غير مؤكدة، وتحتاج دراسة أعمق قبل أن يُتخذ أي قرار بشأن الخيار الموصى به</li><li><b>ج.</b> المنفعة كبيرة بلا شك، والمخاطر محدودة</li><li><b>د.</b> المنفعة بين 200 و500 ألف؛ وإن قلّت عن 250 ألفًا فالخيار الثاني أفضل</li></ul></li>
<li><p>مسودة صاغها نموذج لجهة سياحية افتراضية تستشهد بتقرير بعنوان محدد ورقم صفحة. بحثت عنه فلم تجد ناشرًا ولا نسخة. ماذا تكتب في سجل المراجعة؟</p><ul><li><b>أ.</b> لا شيء، فالعنوان المحدد ورقم الصفحة يدلان على أن التقرير موجود ويمكن الرجوع إليه</li><li><b>ب.</b> تطلب من النموذج نفسه أن يؤكد وجود التقرير</li><li><b>ج.</b> مرجع لا يمكن التحقق منه، عالٍ؛ يُحذف الادعاء أو يُستبدل بدليل من الحزمة</li><li><b>د.</b> تغيّر رقم الصفحة إلى صفحة أولى حتى لا يعترض أحد</li></ul></li>
<li><p>في مسودة لإدارة صيانة افتراضية: «60% من البلاغات عن التكييف». الجدول في القسم نفسه: بلاغات التكييف 1,200 من 4,000. ما العيب؟</p><ul><li><b>أ.</b> رقم غير متسق: الجدول يعطي 30%، والنص 60%</li><li><b>ب.</b> لا عيب، فالنسبة قد تحسب على قاعدة مختلفة</li><li><b>ج.</b> عيب في الأسلوب: النسبة يجب أن تُكتب بالحروف</li><li><b>د.</b> عيب في الإفصاح، فالنسبة لم تُنسب إلى النموذج</li></ul></li>
<li><p>ورقة لعميل حكومي صاغ نموذج مستضاف مسودة قسمين منها، ثم راجعهما مستشار. أي إفصاح يكفي بحسب قاعدة أناة؟</p><ul><li><b>أ.</b> لا إفصاح، فالمستشار راجع القسمين</li><li><b>ب.</b> الأداة، والقسمان اللذان صاغت مسودتهما، ومن راجعهما</li><li><b>ج.</b> جملة «قد يحتوي هذا المستند على محتوى آلي» في التذييل</li><li><b>د.</b> اسم النموذج ورقم إصداره فقط</li></ul></li>
<li><p>في مراجعة مسودة لجهة صحية افتراضية وجدت: خطأ إملائي في عنوان، ورقمًا متناقضًا في جدول التكاليف، وجملة تنسب إلى نص وطني ما لا يقوله عن البيانات الشخصية. بأي ترتيب تعالجها؟</p><ul><li><b>أ.</b> الإملاء أولًا، فهو أول ما يراه القارئ</li><li><b>ب.</b> بترتيب ظهورها في النص</li><li><b>ج.</b> الرقم المتناقض أولًا، ثم النص الوطني، ثم الإملاء</li><li><b>د.</b> النص الوطني أولًا، ثم الرقم، ثم الإملاء</li></ul></li>
<li><p>بحسب مبادئ الذكاء الاصطناعي التوليدي للجهات الحكومية الصادرة عن سدايا، يجوز إدخال بيانات مصنفة «مقيد» في أداة ذكاء اصطناعي توليدي إذا كان اشتراك الأداة مدفوعًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مورد أنظمة يعرض على مستشار يقيّم خياراته لجهة افتراضية رحلة مجانية لحضور مؤتمر المورد في الخارج. ما القرار؟</p><ul><li><b>أ.</b> يقبلها، فالمؤتمر فرصة للتعلم لا مكافأة</li><li><b>ب.</b> يقبلها ويفصح عنها بعد تسليم التوصية</li><li><b>ج.</b> يعتذر عنها ويبلغ الشريكة المسؤولة والعميل بالعرض كتابيًا</li><li><b>د.</b> يحيلها إلى زميل في الشركة لا يعمل في التكليف، فلا يمس العرض التوصية</li></ul></li>
<li><p>في مؤتمر، يسألك مسؤول من جهة أخرى: «سمعت أنكم تعملون مع جهة كذا على مساعد ذكي؛ ماذا أوصيتم؟» والتكليف لم ينتهِ. ما الرد المناسب؟</p><ul><li><b>أ.</b> تتحدث عن طريقتكم في العمل عمومًا، دون ذكر العميل ولا ما أوصيتم به</li><li><b>ب.</b> تذكر التوصية دون الأرقام، فهي ستُعلن قريبًا على أي حال</li><li><b>ج.</b> تحيله إلى زميلك في الفريق ليجيبه بالتفصيل</li><li><b>د.</b> تشرح التوصية كاملة بأرقامها، فالسائل جهة حكومية أيضًا ويحق له الاطلاع</li></ul></li>
<li><p>شركة استشارية كتبت العام الماضي استراتيجية الذكاء الاصطناعي لجهة افتراضية. اليوم تطلب الجهة منها تقييمًا مستقلًا لمدى نجاح تلك الاستراتيجية. ما الأنسب؟</p><ul><li><b>أ.</b> تقبل، فهي أعلم الناس بالاستراتيجية</li><li><b>ب.</b> تقبل، وتكتب في التقرير أنها كتبت الاستراتيجية</li><li><b>ج.</b> تقبل بشرط أن يكتب التقييم فريق آخر داخل الشركة نفسها</li><li><b>د.</b> تفصح عن التعارض، وتعتذر عن التقييم أو تقترح جهة لم تشارك في الاستراتيجية</li></ul></li>
</ol>

يرًا.","misconceptions":["يقدّم التقدير في صورة حقيقة بلا مرجع","يرى كل تقدير ممنوعًا، والتقدير المسمّى جزء من الورقة","","يحوّل نسبة تفضيل إلى تنبؤ بالقبول لا تقوله الاستبانة"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-highest-score","type":"tf","prompt":"الخيار الموصى به في ورقة الخيارات قد لا يحصل على أعلى درجة في كل معيار.","options":[{"key":"أ","text":"صح"},{"key":"ب","text":"خطأ"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"التوصية تأتي من المجموع الموزون ومن الشروط التي لا يُتنازل عنها، وكثيرًا ما يخسر الخيار الموصى به في معيار أو اثنين.","misconceptions":["","يظن أن الخيار الصحيح يجب أن يتفوق في كل شيء، فيُخفي ضعفه في معيار"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo3-uncertainty","type":"single","prompt":"ورقة لهيئة طرق افتراضية توصي بخيار منفعته بين 200 ألف و500 ألف ريال سنويًا. أي صياغة لعدم اليقين أنفع للراعي؟","options":[{"key":"أ","text":"المنفعة المتوقعة 350 ألف ريال سنويًا"},{"key":"ب","text":"المنفعة غير مؤكدة، وتحتاج دراسة أعمق قبل أن يُتخذ أي قرار بشأن الخيار الموصى به"},{"key":"ج","text":"المنفعة كبيرة بلا شك، والمخاطر محدودة"},{"key":"د","text":"المنفعة بين 200 و500 ألف؛ وإن قلّت عن 250 ألفًا فالخيار الثاني أفضل"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"عدم اليقين المفيد يذكر المدى ويقول عند أي قيمة تتغير التوصية، فيعرف الراعي ما يجب أن يراقبه.","misconceptions":["يخفي المدى في رقم واحد يبدو دقيقًا","يذكر عدم اليقين دون أن يقول ما يغيّر التوصية","يهوّن من عدم اليقين ليبدو واثقًا",""],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-citation-check","type":"single","prompt":"مسودة صاغها نموذج لجهة سياحية افتراضية تستشهد بتقرير بعنوان محدد ورقم صفحة. بحثت عنه فلم تجد ناشرًا ولا نسخة. ماذا تكتب في سجل المراجعة؟","options":[{"key":"أ","text":"لا شيء، فالعنوان المحدد ورقم الصفحة يدلان على أن التقرير موجود ويمكن الرجوع إليه"},{"key":"ب","tex
